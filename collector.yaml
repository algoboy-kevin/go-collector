# Collector configuration — short BTC validation run.
#
# Same schema as collector_daily.yaml, but only the families under test, so a
# one-epoch run is cheap. Usage:
#
#   go run ./cmd/collector -config collector.yaml -recording-dir ./data
#
# See CONTEXT.md for the epoch model; see collector_daily.yaml for the full
# five-family schedule.

# Polymarket API credentials (required for WebSocket connection).
# You can get these from https://polymarket.com/profile/api
#
# These are placeholders on purpose: never commit real credentials. Supply the
# live values at deploy time, either by editing a copy of this file outside git
# or by keeping one in .tmp/*.local.yaml (gitignored) and running
# `./deploy.sh -config .tmp/collector_daily.local.yaml`.
connector:
  api_key: "YOUR_POLYMARKET_API_KEY"
  api_secret: "YOUR_POLYMARKET_API_SECRET"
  api_passphrase: "YOUR_POLYMARKET_API_PASSPHRASE"
  gamma_api_url: "https://gamma-api.polymarket.com"
  market_ws_url: "wss://ws-subscriptions-clob.polymarket.com/ws/market"
  user_ws_url: "wss://ws-subscriptions-clob.polymarket.com/ws/user"
  reconnect_interval_ms: 500
  pending_flush_ms: 100

# One epoch, noon→noon ET.
recording:
  days: 1
  epoch: noon_et
  ladder_offset_days: 1

# One hourly and one daily family is enough to validate the epoch model: the
# hourly family proves ET-window alignment (building the hourly slug from the
# UTC hour was the bug that motivated this rework), the daily one proves the
# noon anchor.
series:
  - series: btc_1h
  - series: btc_1d

# RTDS — Polymarket real-time reference price for the underlying asset
# (~1/sec). Continuous; cut into epoch buckets, independent of market rotation.
#   symbols: RTDS symbols, e.g. "btcusdt"
# Output: data/rtds/[{chainlink_twap_}]{symbol}_{epochID}/events.gz + metadata.json
rtds:
  crypto_prices:
    enabled: true
    symbols:
      - btcusdt
      - btc/usd #chainlink

  chainlink_twap:
    enabled: true
    feeds:
      - btc/usd
    window: 60

# Binance — the SETTLEMENT VENUE. Both families above resolve on a Binance
# BTC/USDT candle, so aggTrade is the settlement source; each market's metadata
# names the bucket its outcome can be recomputed from.
#   market:  "spot" (the settlement venue) or "perp" (only useful for basis)
#   streams: "aggTrade"  every trade — the 1m settle candle is derived from it
#            "depth"     top-20 @100ms
#            "kline_5m"  FINAL candles only — cross-check for the derived candle
# Output: data/binance/{market}/{symbol}_{epochID}/events.gz + metadata.json
binance:
  spot:
    symbols:
      - BTCUSDT
    streams:
      - aggTrade
      - kline_5m

  perp:
    symbols: ""
    streams: []
