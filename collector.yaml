# Collector configuration — records Polymarket rolling markets to disk
# for DES backtest replay.
#
# Usage:
#   go run ./cmd/collector -config collector.yaml
#   go run ./cmd/collector -config collector.yaml -recording-dir ./data
#

# Polymarket API credentials (required for WebSocket connection).
# You can get these from https://polymarket.com/profile/api
connector:
  api_key: "YOUR_POLYMARKET_API_KEY"
  api_secret: "YOUR_POLYMARKET_API_SECRET"
  api_passphrase: "YOUR_POLYMARKET_API_PASSPHRASE"
  gamma_api_url: "https://gamma-api.polymarket.com"
  market_ws_url: "wss://ws-subscriptions-clob.polymarket.com/ws/market"
  user_ws_url:   "wss://ws-subscriptions-clob.polymarket.com/ws/user"
  reconnect_interval_ms: 500
  pending_flush_ms: 100

# Rolling market series to record.
# Available series:
#   BTC: btc_5m, btc_15m, btc_1h
#   ETH: eth_5m, eth_15m, eth_1h
#   SOL: sol_5m, sol_15m, sol_1h
#   XRP: xrp_5m, xrp_15m, xrp_1h
#
# count: number of consecutive intervals to record.
#   - 5m series: 12 intervals = 1 hour
#   - 15m series: 4 intervals = 1 hour
#   - 1h series: 24 intervals = 1 day
#   Set to 0 to run indefinitely (until Ctrl+C).
series:
  - series: btc_5m
    count: 50

  # - series: sol_15m
  #   count: 4     # 1 hour of 15-minute windows

  # - series: xrp_1h
  #   count: 24    # 1 day of hourly windows

# RTDS — Polymarket real-time reference price for the underlying asset
# (~1/sec). Continuous; cut into hourly buckets independent of market rotation.
#   symbols: RTDS symbols, e.g. "btcusdt"
# Output: data/rtds/[{SOURCE}_]{SYMBOL}_{hourStartUnix}/events.gz + metadata.json
#         (chainlink_twap folders are prefixed "chainlink_twap_" to avoid
#         colliding with the same symbol recorded as an RTDS reference price)
rtds:
  crypto_prices:
    enabled: true
    symbols:
      - btcusdt
      - btc/usd #chainlink

  chainlink_twap:
    enabled: true
    feeds:
      - btc/usd
    window: 60

# Binance — HFT market data for the underlying asset (aggTrade + partial
# book depth, top-20 @100ms), used to build the 60s TWAP / forecast features in
# Python. Continuous; cut into hourly buckets independent of market rotation.
#   market:  "perp" (USDⓈ-M perpetual, default) or "spot"
#   symbols: Binance symbols, e.g. "BTCUSDT"
#   streams: "aggTrade", "depth" (empty = all)
# Output: data/binance/{SYMBOL}_{hourStartUnix}/events.gz + metadata.json
binance:
  perp:
    symbols:
      - BTCUSDT
    streams:
      - aggTrade
      - depth

  spot:
    symbols: ""
    streams: []