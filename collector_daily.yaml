# Collector configuration — records Polymarket BTC markets on a daily epoch
# for DES backtest replay.
#
# Usage:
#   go run ./cmd/collector -config collector_daily.yaml
#   go run ./cmd/collector -config collector_daily.yaml -recording-dir ./data
#
# The schedule is daily: `recording.days` is how many daily epochs to record,
# and every feed bucket and market recording is keyed to that same epoch.
#
# Polymarket API credentials (required for WebSocket connection).
# You can get these from https://polymarket.com/profile/api
#
# These are placeholders on purpose: never commit real credentials. Supply the
# live values at deploy time, either by editing a copy of this file outside git
# or by keeping one in .tmp/*.local.yaml (gitignored) and running
# `./deploy.sh -config .tmp/collector_daily.local.yaml`.
connector:
  api_key: "YOUR_POLYMARKET_API_KEY"
  api_secret: "YOUR_POLYMARKET_API_SECRET"
  api_passphrase: "YOUR_POLYMARKET_API_PASSPHRASE"
  gamma_api_url: "https://gamma-api.polymarket.com"
  market_ws_url: "wss://ws-subscriptions-clob.polymarket.com/ws/market"
  user_ws_url:   "wss://ws-subscriptions-clob.polymarket.com/ws/user"
  reconnect_interval_ms: 500
  pending_flush_ms: 100
  # Per-message WebSocket read limit, in bytes. The market channel re-sends ONE
  # handshake carrying EVERY subscribed asset_id after a reconnect, and the
  # server replies with a book snapshot for each: at the research set (~160-250
  # books × ~2.7 KB) that is 430-675 KB, over the connector's 1 MiB default. An
  # oversized frame fails the read, closes the socket, re-subscribes, and pulls
  # the same reply — a reconnect loop that loses exactly the deepest books. 8 MiB
  # leaves headroom for the full ladder set at peak.
  read_limit_bytes: 8388608

# Recording-health thresholds.
#   market_silence_timeout_s: a market recording whose last event predates its
#       settlement by more than this is flagged truncated (tail_gap_ms), so a
#       feed that died mid-window is never read as a complete recording.
#   book_stale_timeout_s: fallback HARD upper bound on how old the last book
#       may be at settlement for a synthetic resolve to trust it. It is
#       consulted ONLY when no feed-liveness evidence exists (no collector / no
#       market-WS status source). With a status source wired — as the binary
#       does — staleness is judged by whether the [last book, settlement]
#       interval was covered by a real outage (a market-WS disconnect or a
#       whole-feed silence), so a quiet-but-healthy ladder strike that gets no
#       price_change for minutes still resolves from its book rather than being
#       mislabeled "stale_book".
#   Negative disables a check; 0 selects the default.
collector:
  market_silence_timeout_s: 60
  book_stale_timeout_s: 120
  # Price_change coalescing (opt-in). 0 or absent keeps the existing raw output:
  # one record per price_change, gzip.BestSpeed. A positive value is the fixed
  # received_at window in milliseconds — 100 is the intended setting (250/1000
  # are also supported) — and switches the session's events.gz to gzip L6.
  #   price_change_coalesce_ms: 100
  price_change_coalesce_ms: 0

# How long to record, and where the daily boundary sits.
#
#   days: 3                → epochs D0, D0+1, D0+2, then the run stops (the
#                            ladder event of D0+3 is picked up during D0+2 but
#                            never settles in-run, so it is written truncated)
#   epoch: noon_et         → epoch D = [12:00 ET on D-1, 12:00 ET on D). This is
#                            the default because three of the four families
#                            settle on the 12:00 ET candle of their title date;
#                            midnight_et exists for the deferred hit-price family
#   ladder_offset_days: 1  → also hold the NEXT settlement day's ladder, so every
#                            ladder event has a full pre-settlement history
#
# Boundaries are computed in America/New_York, so they follow DST.
recording:
  days: 3
  epoch: noon_et
  ladder_offset_days: 1

# Market families to record, resolved through the series registry
# (pkg/libs/series.go). The registry — not this file — holds the Gamma series
# slug and the resolution rule, because those were verified against live Gamma;
# a wrong entry here silently records the wrong market.
#
#   up/down   btc_1h   btc_4h   btc_1d      (1 market per event)
#   ladder    btc_above (11 strike rungs)   btc_range (11 range buckets)
#   hit       btc_hit   (daily, observes a whole ET day, settles at midnight)
#             btc_hit_1w (weekly, observes Mon 00:00 ET → Sun 23:59 ET)
#
# strikes: ladder rungs to keep on each side of the spot price at session start;
#          0 records every rung. The ladder families are recorded in full here so
#          the research set has the whole ladder around spot, not a 3-per-side
#          slice that a later re-strike can push out of view.
series:
  - series: btc_1h
  - series: btc_4h
  - series: btc_1d
  - series: btc_above
    strikes: 0
  - series: btc_range
    strikes: 0
  - series: btc_hit
  - series: btc_hit_1w

# RTDS — Polymarket real-time reference price for the underlying asset
# (~1/sec). Continuous; cut into epoch buckets, independent of market rotation.
#   symbols: RTDS symbols, e.g. "btcusdt"; anything containing "/" is a
#            Chainlink feed and is subscribed through the chainlink channel.
# Output: data/rtds/[{chainlink_twap_}]{symbol}_{epochID}/events.gz + metadata.json
#         (chainlink_twap folders are prefixed to avoid colliding with the same
#         symbol recorded as a plain RTDS reference price)
rtds:
  crypto_prices:
    enabled: true
    symbols:
      - btcusdt
      - btc/usd #chainlink

  chainlink_twap:
    enabled: true
    feeds:
      - btc/usd
    window: 60

# Binance — HFT market data for the underlying asset, and the SETTLEMENT VENUE:
# every BTC family except up/down-4h resolves on a Binance BTC/USDT candle, so
# aggTrade *is* the settlement source. Each market's metadata names the bucket
# its outcome can be recomputed from. Continuous; cut into epoch buckets.
#   market:  "spot" (the settlement venue) or "perp" (only useful for basis)
#   streams: "aggTrade"  every trade — the 1m settle candle is derived from it
#            "depth"     top-20 @100ms
#            "kline_5m"  FINAL candles only — the integrity cross-check for the
#                        derived 1m candle
#            "kline_1m"  FINAL 1m candles — the settlement candle itself for the
#                        hit-price family ("any 1m candle high >= strike")
# Output: data/binance/{market}/{symbol}_{epochID}/events.gz + metadata.json
#         (the market directory is what keeps spot and perp apart — both record
#         the same BTCUSDT symbol)
binance:
  spot:
    symbols:
      - BTCUSDT
    streams:
      - aggTrade
      - depth
      - kline_5m
      - kline_1m

  perp:
    symbols: ""
    streams: []
